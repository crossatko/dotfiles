# Chromium 141+ enabled the WaylandWpColorManagerV1 protocol by default,
# which fights with Hyprland's own color management (monitor1 runs cm =
# "srgb", see hyprland/monitors.lua) and renders as bland/shifted colors.
# Disabling it lets Hyprland's color management handle Brave like any other
# non-color-managed client, which looks correct.
--disable-features=WaylandWpColorManagerV1
