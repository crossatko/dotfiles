onboarding = false

[keys]
prefix = ["f4", "f3", "ctrl+b"]
previous_tab = "alt+h"
focus_pane_left = ["prefix+h", "ctrl+alt+h"]
# prefix+l opens lazygit (see keys.command below)
focus_pane_right = "ctrl+alt+l"
next_tab = "alt+l"
new_tab = "prefix+t"
new_workspace = "prefix+n"
close_tab = "prefix+x"
# pane close moves to shift+x (herdr shares one key map between prefix and navigate mode, so x cannot also close workspaces)
close_pane = "prefix+shift+x"
edit_scrollback = "prefix+shift+e"
open_notification_target = "prefix+shift+o"
next_workspace = ["prefix+j", "alt+j"]
previous_workspace = ["prefix+k", "alt+k"]
next_agent = "alt+shift+j"
previous_agent = "alt+shift+k"
# pane up/down move to the arrow keys (j/k now switch workspaces)
focus_pane_down = ["prefix+down", "ctrl+alt+j"]
focus_pane_up = ["prefix+up", "ctrl+alt+k"]
# navigate mode: j/k move between workspaces, panes move to the arrow keys (h/l stay for left/right)
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_up = "up"
navigate_pane_down = "down"

[[keys.command]]
key = "prefix+p"
type = "shell"
command = "$HOME/dotfiles/config/herdr/auto-split.sh"
description = "split along the longer side"

[[keys.command]]
key = "prefix+l"
type = "shell"
command = "$HOME/dotfiles/config/herdr/auto-split.sh lazygit"
description = "lazygit in a new split"

# herdr-nvim (plugin chmarax.herdr-nvim); its keys took over herdr's defaults for scrollback edit and notification target
[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

[ui]
prompt_new_tab_name = false
tab_bar_position = "bottom"

[ui.sidebar.agents]
rows = [
  ["state_icon", { token = "machine", rules = [{ equals = "local", ignore_case = true, hide = true }] }, "workspace", "tab"],
  ["agent"],
]

[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", { token = "terminal_title_stripped", fg = "#bbb9d5", bold = false, dim = false }],
  [{ token = "machine", bold = false, dim = true, rules = [{ equals = "local", ignore_case = true, hide = true }] }, { token = "workspace", bold = false, dim = true }, { token = "$ctx", fg = "#676575", bold = false, dim = true }],
]
pi = [
  ["state_icon", { token = "terminal_title_stripped", fg = "#bbb9d5", bold = false, dim = false }],
  [{ token = "machine", bold = false, dim = true, rules = [{ equals = "local", ignore_case = true, hide = true }] }, { token = "workspace", bold = false, dim = true }, { token = "$ctx", fg = "#676575", bold = false, dim = true }],
]

