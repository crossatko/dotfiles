# AeroSpace (own fork: dwindle, swipe, focus follows mouse, clickable menu bar; built with
# script/build-local-app.sh in the fork repo, installed as /Applications/AeroSpace.app).
# Default config path (~/.config/aerospace/aerospace.toml -> this file). Binds are generated:
# `python3 -I config/karabiner/generate.py --aerospace` prints the main binding lines.
# Mirrors the Hyprland binds (config/hypr/hyprland/binds.lua): left Option = SUPER, right Cmd = ALT
# (Karabiner, config/karabiner/generate.py, emits the combos bound below).
# Full table: AGENTS.md, "macOS" section. Reload: `aerospace reload-config`.
# Top-level keys must stay above the first table header (TOML puts later keys into that table).

config-version = 2

after-startup-command = []

start-at-login = true   # per-user login item (SMAppService)
auto-reload-config = false

# Dwindle: a new window splits the focused one along its longest side.
dwindle = true
mouse-modifier = 'alt'   # left Option (SUPER) + left drag moves, + right drag resizes (any window area)

enable-normalization-flatten-containers = true
# off: dwindle picks the orientation from the window aspect
enable-normalization-opposite-orientation-for-nested-containers = false

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false
# Focus the window under the cursor without raising it (replaces AutoFocus)
focus-follows-mouse.mode = 'no-raise'
key-mapping.preset = 'qwerty'

# Menu bar item: click a workspace to switch, scroll over it = previous/next non-empty workspace
menu-bar-clickable = true
menu-bar-scroll-switch = true

# Gaps: between windows (inner) and to the screen edges (outer)
gaps.inner.horizontal = 10
gaps.inner.vertical = 10
gaps.outer.left = 10
gaps.outer.bottom = 10
gaps.outer.top = 10
gaps.outer.right = 10

# Three-finger trackpad swipe = previous/next workspace (replaces SwipeAeroSpace). The macOS
# three-finger horizontal swipe is off (trackpad defaults, see AGENTS.md).
# Park inactive workspaces by order: lower ones at the bottom-left corner, higher ones at the bottom-right (only a corner pixel stays visible); Mission Control with "Group windows by application" on follows the sides
hidden-window-placement = 'directional-corner'
hidden-window-sliver = 1   # visible part of parked windows in points: default 1, integers only (fractions make macOS pull windows ~40 pt back on screen), 0 untested
# 5-8 always exist, so the built-in display shows 5 instead of an invented stub workspace (13) when all of them are empty
persistent-workspaces = ['5', '6', '7', '8']
[gestures]
workspace-swipe = true
workspace-swipe-fingers = 3
# Percent of the trackpad width the fingers travel before it switches. 12 ~ 48 pt on the
# ~402 pt wide trackpad, the distance the Skyland config switched at (120 pt x 40 %).
workspace-swipe-threshold = 12
workspace-swipe-natural = true     # fingers right = previous workspace (like macOS Spaces)
workspace-swipe-skip-empty = true
workspace-swipe-wrap = false

# Workspaces per display, by display name (case-insensitive regex, first match wins):
#   iPad (Sidecar) connected: q w e r (5-8) go to the iPad, the rest stays on the Mac.
#   another display (any non-built-in, non-iPad): a s d f + z x c v (1-4, 9-12) go there,
#   q w e r stays on the Mac. Nothing connected: all on the built-in display.
# Check names with `aerospace list-monitors`.
[workspace-to-monitor-force-assignment]
1 = ['^(?!.*(built-in|ipad|sidecar))', 'built-in']
2 = ['^(?!.*(built-in|ipad|sidecar))', 'built-in']
3 = ['^(?!.*(built-in|ipad|sidecar))', 'built-in']
4 = ['^(?!.*(built-in|ipad|sidecar))', 'built-in']
5 = ['ipad|sidecar', 'built-in']
6 = ['ipad|sidecar', 'built-in']
7 = ['ipad|sidecar', 'built-in']
8 = ['ipad|sidecar', 'built-in']
9 = ['^(?!.*(built-in|ipad|sidecar))', 'built-in']
10 = ['^(?!.*(built-in|ipad|sidecar))', 'built-in']
11 = ['^(?!.*(built-in|ipad|sidecar))', 'built-in']
12 = ['^(?!.*(built-in|ipad|sidecar))', 'built-in']

# Apps pinned to a workspace (Hyprland rules.lua: chat on 7, mail on 8, media on 11). By bundle id;
# rules for apps that aren't installed just never match.
[[on-window-detected]]
if.app-id = 'com.brave.Browser'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'net.kovidgoyal.kitty'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'com.apple.mail'
run = 'move-node-to-workspace 8'

[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = 'move-node-to-workspace 7'

[[on-window-detected]]
if.app-id = 'org.whispersystems.signal-desktop'
run = 'move-node-to-workspace 7'

[[on-window-detected]]
if.app-id = 'net.whatsapp.WhatsApp'
run = 'move-node-to-workspace 7'

[[on-window-detected]]
if.app-id = 'com.apple.MobileSMS'
run = 'move-node-to-workspace 7'

[[on-window-detected]]
if.app-id = 'org.mozilla.thunderbird'
run = 'move-node-to-workspace 8'

[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = 'move-node-to-workspace 11'

# Windows that should float (Hyprland: pavucontrol/blueman/portal dialogs float). By bundle id.
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.archiveutility'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.Passwords'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.1password.1password'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'org.pqrs.Karabiner-Elements.Settings'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'org.pqrs.Karabiner-EventViewer'
run = 'layout floating'

[mode.main.binding]
    # Keys are the combos Karabiner emits (config/karabiner/generate.py; table in AGENTS.md):
    #   Hyprland SUPER (left Option)          -> cmd-ctrl-alt-
    #   SUPER+SHIFT                           -> cmd-ctrl-alt-shift-
    #   Hyprland ALT (right Command)          -> ctrl-alt-shift-
    #   SUPER+ALT                             -> cmd-ctrl-shift-
    #   SUPER+ALT+SHIFT                       -> cmd-alt-shift-
    # Regenerate this block with `python3 -I config/karabiner/generate.py --aerospace`.
    cmd-ctrl-alt-enter = 'exec-and-forget /Applications/kitty.app/Contents/MacOS/kitty --single-instance'
    cmd-ctrl-alt-b = 'exec-and-forget open -na "Brave Browser" --args --new-window'
    cmd-ctrl-alt-e = 'exec-and-forget open -a Finder'
    cmd-ctrl-alt-shift-q = 'close'
    cmd-ctrl-alt-f = 'fullscreen'
    cmd-ctrl-alt-v = 'layout floating tiling'
    cmd-ctrl-alt-x = 'layout tiles horizontal vertical'
    cmd-ctrl-alt-h = 'focus left'
    cmd-ctrl-shift-h = 'move left'
    cmd-alt-shift-h = 'resize width -50'
    cmd-ctrl-alt-j = 'focus down'
    cmd-ctrl-shift-j = 'move down'
    cmd-alt-shift-j = 'resize height +50'
    cmd-ctrl-alt-k = 'focus up'
    cmd-ctrl-shift-k = 'move up'
    cmd-alt-shift-k = 'resize height -50'
    cmd-ctrl-alt-l = 'focus right'
    cmd-ctrl-shift-l = 'move right'
    cmd-alt-shift-l = 'resize width +50'
    ctrl-alt-shift-a = 'workspace 1'
    cmd-ctrl-shift-a = 'move-node-to-workspace 1'
    ctrl-alt-shift-s = 'workspace 2'
    cmd-ctrl-shift-s = 'move-node-to-workspace 2'
    ctrl-alt-shift-d = 'workspace 3'
    cmd-ctrl-shift-d = 'move-node-to-workspace 3'
    ctrl-alt-shift-f = 'workspace 4'
    cmd-ctrl-shift-f = 'move-node-to-workspace 4'
    ctrl-alt-shift-q = 'workspace 5'
    cmd-ctrl-shift-q = 'move-node-to-workspace 5'
    ctrl-alt-shift-w = 'workspace 6'
    cmd-ctrl-shift-w = 'move-node-to-workspace 6'
    ctrl-alt-shift-e = 'workspace 7'
    cmd-ctrl-shift-e = 'move-node-to-workspace 7'
    ctrl-alt-shift-r = 'workspace 8'
    cmd-ctrl-shift-r = 'move-node-to-workspace 8'
    ctrl-alt-shift-z = 'workspace 9'
    cmd-ctrl-shift-z = 'move-node-to-workspace 9'
    ctrl-alt-shift-x = 'workspace 10'
    cmd-ctrl-shift-x = 'move-node-to-workspace 10'
    ctrl-alt-shift-c = 'workspace 11'
    cmd-ctrl-shift-c = 'move-node-to-workspace 11'
    ctrl-alt-shift-v = 'workspace 12'
    cmd-ctrl-shift-v = 'move-node-to-workspace 12'
