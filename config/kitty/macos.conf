# macOS-only part of kitty.conf, pulled in by `include ${KITTY_OS}.conf`.

# Left option acts as alt (zellij Alt bindings); right option types special characters again. Alt+hjkl pane/tab nav comes from right Cmd + hjkl in kitty (Karabiner, config/karabiner).
macos_option_as_alt left

# No kitty shortcuts (tabs, windows, layouts...): zellij manages everything. Only copy/paste and font size stay.
clear_all_shortcuts yes
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard
map cmd+plus  change_font_size all +2.0
map cmd+equal change_font_size all +2.0
map cmd+minus change_font_size all -2.0
map cmd+0     change_font_size all 0

# No title bar (window keeps its macOS shadow and rounded corners; AeroSpace tiles it)
hide_window_decorations titlebar-only

# Paper Mono as the variable font brew installs (written by kitty's font kitten, which edits kitty.conf:
# if it adds a BEGIN_KITTY_FONTS block there again, move it here so Linux keeps the family="Paper Mono" lines).
# BEGIN_KITTY_FONTS
font_family      family='Paper Mono' variable_name=PaperMono style=PaperMono-Regular
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# WC3 icons for the zellij claude-tabs plugin: macOS needs the sbix build "WC3 Icons Mac" (CoreText does not draw
# the CBDT "WC3 Icons" used in linux.conf), installed to ~/Library/Fonts by fontconfig/install-mac.sh of the package.
# Side effect: the coloured-circle emoji U+1F7E0..U+1F7E6 render as WC3 icons in kitty.
symbol_map U+1F7E0-U+1F7E6 WC3 Icons Mac
symbol_map U+1FA70-U+1FAD6 WC3 Icons Mac
