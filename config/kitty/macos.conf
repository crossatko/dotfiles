# macOS-only part of kitty.conf, pulled in by `include ${KITTY_OS}.conf`.

# Left option acts as alt (zellij Alt bindings); right option types special characters again. Alt+hjkl pane/tab nav comes from right Cmd + hjkl in kitty (Karabiner, config/karabiner).
macos_option_as_alt left

# No title bar (window keeps its macOS shadow and rounded corners; AeroSpace tiles it)
hide_window_decorations titlebar-only
