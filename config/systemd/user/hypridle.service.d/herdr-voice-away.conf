# hypridle never runs on-resume for an idle it did not see end. Clear the Herdr voice away flag
# (see config/hypr/hypridle.conf) whenever hypridle starts or stops, so a restart while idle cannot leave the voice mute.
[Service]
ExecStartPre=-/bin/rm -f %t/herdr-voice-away
ExecStopPost=-/bin/rm -f %t/herdr-voice-away
