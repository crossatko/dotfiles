[Service]
# Do NOT set WAYLAND_DISPLAY here. Unset it.
#
# Root cause of both the "hooking has failed somewhere" dialogs and the
# washed-out HDR, confirmed live from a running game's own /proc/PID/environ
# (Ori, pid 236135, inside its pressure-vessel container):
#
#   GAMESCOPE_WAYLAND_DISPLAY=/run/pressure-vessel/gamescope-socket
#   WAYLAND_DISPLAY=wayland-0
#
# gamescope's WSI layer gates *all* hooking on isRunningUnderGamescope()
# (layer/VkLayer_FROG_gamescope_wsi.cpp):
#
#   if (waylandSocketName && *waylandSocketName &&
#       strcmp(gamescopeSocketName, waylandSocketName) != 0)
#     return false;
#
# It is a nested-session guard: "if WAYLAND_DISPLAY names something other
# than gamescope's own socket, we must be a nested client, so don't hook."
# An *unset* WAYLAND_DISPLAY passes; a mismatched one always fails. Inside
# the container pressure-vessel rewrites GAMESCOPE_WAYLAND_DISPLAY to an
# absolute bind path while exposing the shared Wayland socket under the
# generic name wayland-0, so the two can never compare equal -- meaning any
# value here fails, which is why the earlier WAYLAND_DISPLAY=gamescope-0
# "fix" changed nothing. CreateInstance then bails before hooking anything:
# confirmed by the layer printing no "Application info:"/"Executable name:"
# for the game (it only ever logged "Forcing on VK_EXT_swapchain_
# maintenance1", which CreateDevice emits unconditionally, hooked or not).
#
# Both symptoms follow from that single bail. No hook means no registered
# surface, so CreateSwapchainKHR raises the dialog; and with no hooked
# swapchain gamescope never learns the app's real colorspace, defaulting to
# GAMESCOPE_APP_TEXTURE_COLORSPACE_SRGB (steamcompmgr.cpp) -- SDR handling
# applied to genuinely HDR content, i.e. lifted blacks.
#
# Pressure-vessel only binds a Wayland socket into the container if the host
# process has one, so unsetting here removes wayland-0 from the container
# entirely and the guard passes via its "unset" branch. This also restores
# the pre-2026-07-27T17:56 condition, when SDDM started the session and no
# Hyprland WAYLAND_DISPLAY had been imported into the systemd --user
# environment: the journal shows 1001 successful surface hooks up to
# 17:04:45 that day (with "server hdr output enabled: true" and "hdr formats
# exposed to client: true"), and exactly zero after the switch to launching
# gamescope-session out of a live Hyprland session.
#
# Nothing here needs Wayland: Steam and the game are both XWayland clients
# (DISPLAY=:0 and :1 respectively), and the layer reaches gamescope through
# GAMESCOPE_WAYLAND_DISPLAY, which the packaged gamescope-session supplies
# dynamically off gamescope's ready-pipe via EnvironmentFile=%t/gamescope-
# environment. Mirrors the identical UnsetEnvironment already used by
# gamescope-session.service for the same Hyprland leak.
UnsetEnvironment=WAYLAND_DISPLAY
