[Service]
Environment="OUTPUT_CONNECTOR=HDMI-A-1"
# Differential test: "fixed" mode generation (the script's own default)
# relies on matching one of the TV's exact EDID-advertised modes, which
# combined with VRR (also on by default in this session) is a plausible
# source of the "drm: flip error: Invalid argument" that persisted even
# after fixing the connector selection. "cvt" synthesizes a mode instead of
# matching an EDID one -- trying it to see if that's what's actually
# invalid.
Environment="DRM_MODE=cvt"
# Hyprland's own autostart imports WAYLAND_DISPLAY into the shared systemd
# --user environment (so its own user services can find its socket), which
# then leaks into gamescope-session.service too -- it tried to connect to
# Hyprland's socket (wayland-1) as a nested client instead of starting its
# own independent rootful session, and failed ("Failed to connect to
# wayland socket: wayland-1"). Unset it here for the same reason the
# packaged service already unsets DISPLAY/XAUTHORITY.
UnsetEnvironment=WAYLAND_DISPLAY

# Shadows the real gamescope binary via PATH so gamescope-session's own
# hardcoded `exec gamescope \ ...` line (no env-var-driven way to append
# flags) picks up --expose-wayland/--hdr-enabled/--hdr-itm-enable -- see
# gamescope-wrapper/gamescope for the actual flags and reasoning. Only
# affects this one service's PATH lookup, not gamescope system-wide.
Environment="PATH=/home/kreejzak/dotfiles/config/hypr/scripts/gamescope-wrapper:/usr/local/sbin:/usr/local/bin:/usr/bin:/usr/share/dotnet:/home/kreejzak/.dotnet/tools:/home/kreejzak/.local/share/flatpak/exports/bin:/var/lib/flatpak/exports/bin:/usr/bin/site_perl:/usr/bin/vendor_perl:/usr/bin/core_perl:/opt/rocm/bin"

# Same Proton tuning already applied on the Hyprland side (env.lua) --
# game-level behavior, not compositor-specific, so equally applicable here.
Environment="PROTON_LOW_LATENCY=1"
Environment="PROTON_FSR4_UPGRADE=1"
Environment="DISABLE_LSFG=1"

# DISABLE_GAMESCOPE_WSI=1 was here as a workaround for the "hooking has
# failed somewhere" dialogs. It is deliberately gone: the dialogs were only
# ever a symptom, and suppressing the layer also permanently gave up HDR,
# since the layer is the only thing that tells gamescope an app's real
# colorspace.
#
# The real cause was in steam-launcher.service.d/override.conf, not here --
# a leaked WAYLAND_DISPLAY tripping the WSI layer's nested-session guard
# inside the game's pressure-vessel container, so it refused to hook
# anything. See that file for the full mechanism. Fixing it there resolved
# the dialogs AND the washed-out HDR together, verified live: the layer now
# logs "Executable name: oriwotw.exe" plus "hdr formats exposed to client:
# true", with zero non-hooked swapchains and the compositor's
# GAMESCOPE_COLOR_APP_WANTS_HDR_FEEDBACK atom finally reading 1.
#
# Do not re-add DISABLE_GAMESCOPE_WSI. If the dialogs ever return, the thing
# to check is whether a WAYLAND_DISPLAY has crept back into the game's
# environment (tr '\0' '\n' < /proc/<game-pid>/environ), not this layer.
