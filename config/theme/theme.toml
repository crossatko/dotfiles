# The one place to edit theme settings. After changing anything here run:
#   ~/.config/theme/theme.py render      (re-render, no wallpaper analysis)
#   ~/.config/theme/theme.py apply [img] (analyse wallpaper, render, reload apps)

wallpaper = "~/.cache/theme/video/raycast-hero-4k120-hevc-full-once2-3a6ed8756fb7-t1500.png"
# folders the quickshell picker (SUPER+T) scans for images
wallpaper_dirs = ["~/Pictures/wallpapers"]
# folders scanned for VIDEO wallpapers (mp4/webm/mkv, played by mpvpaper); unset = <xdg VIDEOS dir>/wallpapers
video_dirs = ["~/Videos/wallpapers"]
# Replays of a play-once clip (switching to an empty workspace): short bursts that advance the clip along its loop, each an
# ease-in from rest followed by the wind-down. replay_ease_in = seconds of the ease-in of every burst (0 = none, per monitor in
# Settings; a burst is at least 1 s long).
replay_ease_in = 0.5

[settings]
ansi_saturation = 0.38   # 0 = greyscale terminal colors, 1 = vivid
ansi_lightness = 0.64
bg_max_lightness = 0.075 # keeps backgrounds near-black whatever the image is
restart_hyprpaper = true
icons = true             # generate a hue-matched copy of Adwaita (Wall-Adwaita) and use it
icon_base = "Adwaita"
icon_recolor = "blue"    # "blue": only Adwaita's blue family follows the accent; "all": every color
icon_saturation = 0.8    # scales icon saturation (greyscale wallpapers desaturate automatically)
ui_font = "Paper Mono"   # UI font for Qt, KDE and GTK apps ("" = leave fonts alone)
ui_font_size = 11
qt_style = "kvantum"     # Qt widget style: "kvantum" = the generated Kvantum theme Wall (translucent glass windows); "Fusion" = opaque, palette only
qt_symbolic_icons = true # Qt / KDE like libadwaita: icon theme Wall-Adwaita-Qt (symbolic toolbar / sidebar icons) + kdeglobals 16 px icon-only toolbars, Dolphin places 16 px
brave = true             # write a seed-color theme into Brave (applied when Brave is closed)
brave_seed = "accent_soft"  # palette key used as the seed; brave_variant: 0 system,1 tonal,2 neutral,3 vibrant
brave_variant = 2
brave_mode = "gtk"       # "gtk": Brave in GTK mode with the Wall-Glass theme (glass tab strip; bin/brave exports GTK_THEME=Wall-Glass:dark); "seed": the seed-color theme above
brave_tab_text = "fg"     # GTK mode: colour of the active tab title, which Chromium ties to the toolbar icons: "fg" or "accent" (both)
brave_gtk_seed = "accent"       # GTK mode: palette key seeding Chromium's accent (omnibox focus ring, toggles), e.g. "accent"; "" = leave Brave's own (blue)
brave_gtk_variant = 3     # variant for that seed: 3 vibrant keeps it close to the colour (2 neutral mutes it to grey-red)
quit_on_apply = []       # GTK4/libadwaita apps cannot restyle open windows; e.g. ["nautilus -q"] closes them so the next one is themed
rounding = 0             # default corner radius (px) of the quickshell elements; Hyprland windows: hypr/hyprland/theme.lua. Settings > Appearance overrides both
gap = 0                  # quickshell default window gap (px, floating bar margin); keep in sync with gaps in hypr/hyprland/settings.lua
border_size = 2          # quickshell default for the window border shown in Settings > Appearance; Hyprland: hypr/hyprland/theme.lua
bar_floating = false     # default bar mode: false = docked, true = floating (margins = gap, radius = rounding)
smart_gaps = true        # quickshell default of the lone-window toggle (the rules live in hypr/hyprland/managed.lua, on unless overridden)
bar_border = 0           # px width of the bar outline
bar_opacity = 0.55       # quickshell bar background alpha; hyprland blur shows through; keep above ignore_alpha (0.1) in hypr/hyprland/rules.lua
# GTK glass (templates/gtk4.css: libadwaita / all GTK4 apps; templates/gtk3.css: client-side-decorated GTK3 windows).
# Tint, darkening, saturation etc. come from Settings > Glass: the compositor applies them to the glass behind GTK
# windows exactly as behind the shell's cards, live. The CSS paints a base fill (bg at the shell card fill 0.3 on the
# solid_glass host, bar_opacity over plain blur; gtk_glass_fill overrides on any host) and these OFFSETS are added to that fill per part (effective opacity, 0-1 total;
# theme.py derives each stacked layer's alpha). Apps pick CSS changes up on restart. gtk_glass = false = opaque
# stock look, no compositor blur request.
gtk_glass = true
# gtk_glass_fill = 0.55  # base fill override (unset: 0.3 on solid_glass, bar_opacity over plain blur)
gtk_glass_chrome = 0.0    # window background, headerbars in toolbar views (= the shell card)
gtk_glass_header = 0.05   # standalone / raised headerbars, search bar, action bar
gtk_glass_sidebar = 0.05  # sidebars (Nautilus places)
gtk_glass_view = 0.15     # content: file grid / list, text views, list boxes, cards
gtk_glass_popover = 0.5   # menus and popovers (own surface, not stacked)
gtk_glass_dialog = 0.55   # dialogs (separate windows and in-window sheets)
gtk_glass_control = 0.07  # pathbar, entries, buttons in bars: fg at this alpha like the shell's buttons (hover x2)
# brave_glass_alpha = 0.6  # Brave GTK-mode tab strip alpha override (unset: base fill + gtk_glass_header)

# Pin any palette color by name; everything else follows the wallpaper.
# Keys: bg bg_alt surface surface2 overlay muted subtle fg_dim fg accent accent2 accent_soft
#       red orange yellow green cyan blue magenta black white bright_<name> error warn ok info
[overrides]
# accent = "#c0392b"

# Free-form values templates can use as {{name}}
[vars]
font = "Paper Mono"
tv_wallpaper = "~/Pictures/wallpapers/nier.jpg"   # HDMI-A-1 only; not touched by the picker
