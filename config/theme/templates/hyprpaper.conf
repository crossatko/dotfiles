# generated by ~/.config/theme/theme.py -- do not edit (wallpaper set in theme.toml)
splash=false
preload={{wallpaper}}
preload={{tv_wallpaper}}

wallpaper {
    monitor = desc:Microstep MPG271QX OLED 0x01010101
    path = {{wallpaper}}
    fit_mode = cover
}

wallpaper {
    monitor = desc:Dell Inc. DELL U2515H 9X2VY5AK1D5L
    path = {{wallpaper}}
    fit_mode = cover
}

wallpaper {
    monitor = desc:Technical Concepts Ltd Beyond TV 0x00010000
    path = {{wallpaper}}
    fit_mode = cover
}

wallpaper {
    monitor = HDMI-A-1
    path = {{tv_wallpaper}}
    fit_mode = cover
}
