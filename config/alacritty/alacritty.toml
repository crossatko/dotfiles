[general]
# Colors are generated: edit ~/.config/theme/theme.toml
import = ["~/.config/theme/out/alacritty.toml"]

# Alacritty Configuration

[window]
padding = { x = 0, y = 0 }
dynamic_title = true
opacity = 0.8
# For Linux/BSD to ensure opacity works
decorations = "full"

[scrolling]
history = 10000

[font]
size = 18.0

[font.offset]
x = 0
y = -2  # Increase this for more space between lines, decrease for less

[font.normal]
family = "Paper Mono"
style = "Regular"

[font.bold]
family = "Paper Mono"
style = "Bold"

[font.italic]
family = "Paper Mono"
style = "Italic"
