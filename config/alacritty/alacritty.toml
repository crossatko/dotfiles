[general]
# Colors are generated: edit ~/.config/theme/theme.toml
import = ["~/.config/theme/out/alacritty.toml", "~/.config/theme/out/alacritty-font.toml"]  # colors, then the font family (Settings > Look > Type)

# Alacritty Configuration

[window]
padding = { x = 0, y = 0 }
dynamic_title = true
opacity = 0.8
# For Linux/BSD to ensure opacity works
decorations = "full"

[scrolling]
history = 10000

[font]
size = 18.0

[font.offset]
x = 0
y = -2  # Increase this for more space between lines, decrease for less

# font family: generated (out/alacritty-font.toml); bold / italic follow it
