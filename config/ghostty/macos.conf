# macOS-only Ghostty overrides. Linked as ~/Library/Application Support/com.mitchellh.ghostty/config,
# which Ghostty reads on macOS after ~/.config/ghostty/config (Linux never loads this file).
font-size = 20
adjust-cell-height = 4
# Native Liquid Glass (macOS 26+); macOS shows it nearly opaque while the window is unfocused
background-blur = macos-glass-clear
macos-titlebar-style = hidden
# Left Option = Alt (zellij), right Option types special characters
macos-option-as-alt = left
# No Ghostty shortcuts (tabs, splits, windows...): zellij manages everything. Only these stay:
keybind = clear
keybind = super+c=copy_to_clipboard:mixed
keybind = super+v=paste_from_clipboard
keybind = copy=copy_to_clipboard:mixed
keybind = paste=paste_from_clipboard
keybind = super+==increase_font_size:1
keybind = super++=increase_font_size:1
keybind = super+-=decrease_font_size:1
keybind = super+0=reset_font_size
keybind = super+q=quit
keybind = super+shift+,=reload_config
# Close windows without the "are you sure" popup
confirm-close-surface = false
