# hyprlang if HOST_CROSS_BATTLESTATION

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = bash ~/.config/hypr/scripts/tv-input.sh home
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")' && bash ~/.config/hypr/scripts/on-wake.sh
}

listener {
    timeout = 60
    on-timeout = ddcutil --bus $(bash ~/.config/hypr/scripts/ddc-bus.sh MPG271QX) setvcp 0x10 1
    on-resume = ddcutil --bus $(bash ~/.config/hypr/scripts/ddc-bus.sh MPG271QX) setvcp 0x10 80
}

listener {
    timeout = 300
    on-timeout = ddcutil --bus $(bash ~/.config/hypr/scripts/ddc-bus.sh U2515H) setvcp 0x10 1
    on-resume =  ddcutil --bus $(bash ~/.config/hypr/scripts/ddc-bus.sh U2515H) setvcp 0x10 80
}

listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")' && bash ~/.config/hypr/scripts/on-wake.sh
}

# listener {
#     timeout = 3600
#     on-timeout = systemctl suspend
#     on-resume = hyprctl dispatch 'hl.dsp.dpms("on")' && bash ~/.config/hypr/scripts/on-wake.sh
# }

# hyprlang endif


# hyprlang if HOST_CROSS_WORKSTATION

$philips = 8
$dell = 6

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")' && ddcutil --bus $philips setvcp 0x10 100 && ddcutil --bus $dell setvcp 0x10 100
}

listener {
    timeout = 180
    on-timeout = ddcutil --bus $philips setvcp 0x10 1
    on-resume = ddcutil --bus $philips setvcp 0x10 80
}

listener {
    timeout = 300
    on-timeout = ddcutil --bus $dell setvcp 0x10 1 && ddcutil --bus $philips setvcp 0x10 1
    on-resume =  ddcutil --bus $dell setvcp 0x10 100 && ddcutil --bus $philips setvcp 0x10 100
}

listener {
    timeout = 1200
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")' && ddcutil --bus $philips setvcp 0x10 100 && ddcutil --bus $dell setvcp 0x10 100
}

