# hyprlang if HOST_CROSS_BATTLESTATION

general {
    lock_cmd = pidof hyprlock || hyprlock
    # No before_sleep_cmd. It used to run `tv-input.sh home` here, which could
    # never work: hypridle fires this off logind's PrepareForSleep, and
    # NetworkManager has already torn the network down by then (~1ms after the
    # suspend request). The call failed, sat in tv-input.sh's retry loop, got
    # frozen by the suspend, and completed on the NEXT RESUME -- sending the TV
    # to its dashboard seconds after the machine came back, interrupting
    # whatever was playing on it. That work now lives in scripts/suspend.sh,
    # which runs *before* requesting the suspend, while the network is still up.
    #
    # If the idle auto-suspend listener at the bottom of this file is ever
    # re-enabled, point its on-timeout at scripts/suspend.sh rather than
    # `systemctl suspend` for the same reason.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")' && bash ~/.config/hypr/scripts/on-wake.sh
}

listener {
    timeout = 60
    on-timeout = ddcutil --bus $(bash ~/.config/hypr/scripts/ddc-bus.sh MPG271QX) setvcp 0x10 1
    on-resume = ddcutil --bus $(bash ~/.config/hypr/scripts/ddc-bus.sh MPG271QX) setvcp 0x10 80
}

listener {
    timeout = 300
    on-timeout = ddcutil --bus $(bash ~/.config/hypr/scripts/ddc-bus.sh U2515H) setvcp 0x10 1
    on-resume =  ddcutil --bus $(bash ~/.config/hypr/scripts/ddc-bus.sh U2515H) setvcp 0x10 80
}

listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")' && bash ~/.config/hypr/scripts/on-wake.sh
}

