# Colors are generated from ~/.config/theme/theme.toml
source = ~/.config/theme/out/hyprtoolkit.conf

# Typography
$font_family = Paper Mono
$font_family_monospace = Paper Mono

# Font Sizes (Minimum 20px)
$font_size = 20
$small_font_size = 20
$h3_size = 22
$h2_size = 26
$h1_size = 32

# Application of settings
background = $background
base = $base
text = $text
alternate_base = $alternate_base
bright_text = $bright_text
accent = $accent
accent_secondary = $accent_secondary

font_family = $font_family
font_family_monospace = $font_family_monospace

font_size = $font_size
small_font_size = $small_font_size
h3_size = $h3_size
h2_size = $h2_size
h1_size = $h1_size

# Visuals
rounding_large = 6
rounding_small = 5
