source = ~/.config/theme/out/hyprlock.conf

background {
    path = $wallpaper
    color = $bg
    blur_passes = 2
    blur_size = 4
    noise = 0.04
    contrast = 1.0
    brightness = 0.42
    vibrancy = 0.03
    vibrancy_darkness = 0.15
}

input-field {
    size = 420, 62
    outline_thickness = 4
    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, -1.0 - 1.0
    dots_center = false
    dots_rounding = -1 # -1 default circle, -2 follow input-field rounding
    dots_fade_time = 200 # Milliseconds until a dot fully fades in
    dots_text_format = # Text character used for the input indicator. Leave empty for a rectangle that will be rounded via dots_rounding (default).
    outer_color = $accent_dim $overlay $accent_dim 225deg
    inner_color = $surface
    font_color = $text
    font_family = Paper Mono # Font used for placeholder_text, fail_text and dots_text_format.
    fade_on_empty = false
    fade_timeout = 1000 # Milliseconds before fade_on_empty is triggered.
    placeholder_text = Input Password... # Text rendered in the input box when it's empty.
    hide_input = false
    rounding = 10 # -1 means complete rounding (circle/oval)
    check_color = $ok
    fail_color = $error # if authentication failed, changes outer_color and fail message color
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i> # can be set to empty
    fail_timeout = 2000 # milliseconds before fail_text and fail_color disappears
    fail_transition = 300 # transition time in ms between normal outer_color and fail_color
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1 # when both locks are active. -1 means don't change outer color (same for above)
    invert_numlock = false # change color if numlock is off
    swap_font_color = false # see below

    position = 0, -20
    halign = center
    valign = center
}

label {
    text = $TIME
    color = $text
    font_size = 96
    font_family = Paper Mono
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $bg
    position = 0, 175
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] date +"%A, %d %B"
    color = $accent
    font_size = 22
    font_family = Paper Mono
    position = 0, 70
    halign = center
    valign = center
}
