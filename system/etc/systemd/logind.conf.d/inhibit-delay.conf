# gamescope-sleep-signal-listener.sh takes a mode=delay sleep inhibitor so it
# can put the TV into standby *before* the machine suspends. Without a lock at
# all there is no window whatsoever -- measured on this machine, "PM: suspend
# entry (deep)" lands 3ms after logind broadcasts PrepareForSleep (true,), and
# tv-sleep.sh duly got frozen mid-adb and only finished after the next resume.
#
# The default cap of 5s is a little tight for that work: tv-sleep.sh is two
# `timeout 3 adb` calls, so ~6s worst case (a TV that has dropped off the
# network), and the webhook POST alongside it allows another 5s. 15s leaves
# room without being long enough to be noticeable -- and note the cap is only
# ever *reached* in the failure case, since the lock is released the instant
# the work finishes. Normal path is well under a second.
InhibitDelayMaxSec=15
